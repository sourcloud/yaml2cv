name: Image

on:
  push:
    branches: [master]
  pull_request:
  # Tags publish through release.yml, after CI and the version check pass.
  workflow_call:
    outputs:
      digest:
        description: Digest of the published multi-arch image (tags only)
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build-date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: yaml2cv:ci
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image architecture
        run: |
          arch="$(docker run --rm --entrypoint uname yaml2cv:ci -m)"
          echo "image architecture: $arch"
          test "$arch" = "x86_64"
      - name: Smoke test
        run: |
          docker run -d --name yaml2cv -p 8000:8000 -p 9000:9000 \
            -e ADMIN_BIND_ADDRESS=0.0.0.0 yaml2cv:ci
          scripts/smoke-test.sh http://localhost:8000 http://localhost:9000
      - name: Show logs on failure
        if: failure()
        run: docker logs yaml2cv

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Signing the build provenance (ADR 0031).
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # GHCR reads the description of a multi-arch image from the
          # index annotations, not from the per-platform image labels.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: build-date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
      # SLSA build provenance for the multi-arch index, pushed next to the
      # image; verify with `gh attestation verify` (ADR 0031). Storage
      # records need an organisation-owned repository.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

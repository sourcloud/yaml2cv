name = "yaml2cv"
version = "0.1.0"
description = "Render CVs written in YAML to PDF"
licences = ["Apache-2.0"]
target = "erlang"
repository = { type = "github", user = "sourcloud", repo = "yaml2cv" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
yamerl = ">= 0.10.0 and < 1.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
exception = ">= 2.1.1 and < 3.0.0"
wisp = ">= 2.2.2 and < 3.0.0"
mist = ">= 6.0.3 and < 7.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
envoy = ">= 1.2.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
birdie = ">= 2.0.2 and < 3.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

# Third-party assets committed to this repository (ADR 0032). The notices
# generator (`dev/notices.gleam`) adds them to THIRD_PARTY_NOTICES.md and the
# licenses page. Update an entry together with its files.

[[component]]
name = "Inter"
version = "4.1"
licenses = ["OFL-1.1"]
files = ["priv/fonts/inter/OFL.txt"]

[[component]]
name = "htmx"
version = "2.0.4"
licenses = ["0BSD"]
files = ["priv/static/vendor/htmx-2.0.4.LICENSE"]

# Fonts and data compiled into the Typst binary; its version is the one in
# Typst's Cargo.toml. See third_party/typst-assets/README.md.
[[component]]
name = "typst-assets"
version = "0.15.1"
licenses = [
  "Apache-2.0",
  "OFL-1.1",
  "GUST Font License 1.0",
  "GPL-3.0-or-later WITH Font-exception-2.0",
  "Bitstream-Vera",
]
files = ["third_party/typst-assets/LICENSE", "third_party/typst-assets/NOTICE"]

# NewCM10-Regular is GPL-3.0-or-later: the image must offer its source, the
# FontForge files from CTAN, mirrored as a release asset (ADR 0032).
[[component.sources]]
description = "New Computer Modern 8.1.1, FontForge sources (sfd.txz)"
url = "https://github.com/sourcloud/yaml2cv/releases/download/third-party-sources/newcomputermodern-8.1.1-sfd.txz"
